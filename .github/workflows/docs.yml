# Documentation website (mkdocs.yml, docs/requirements.txt, docs/constraints.txt): https://bsafdi.github.io/axionFEM/
#
# build   on every pull request and every push to main: `mkdocs build --strict` as a check (no compiled core needed:
#         the API reference is read by static analysis). It also uploads the workflow artifact `docs-site` (14 days,
#         a zip on the run page): the site built to browse from disk -- unzip and open index.html (formulas need an
#         internet connection: MathJax comes from a CDN).
# deploy  publishes the site to GitHub Pages. MANUAL ONLY: Actions -> docs -> Run workflow, on main. It never runs on
#         push or on pull requests.
#
# Before the first deploy, a maintainer enables Pages: Settings -> Pages -> Build and deployment -> Source: "GitHub
# Actions". The `github-pages` environment (created by the first deploy, or by hand) should allow deployments from
# main only (Settings -> Environments -> github-pages -> deployment branches). No secrets are needed: the deploy job
# authenticates with the workflow's own OIDC token (permissions below).
name: docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A push to main never cancels a manual deploy (different group), and manual runs are never cancelled.
concurrency:
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  NO_MKDOCS_2_WARNING: "1"
  DISABLE_MKDOCS_2_WARNING: "true"

jobs:
  build:
    name: mkdocs build --strict
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            docs/requirements.txt
            docs/constraints.txt

      - name: Install the documentation tools (pinned)
        run: python -m pip install -r docs/requirements.txt -c docs/constraints.txt

      - name: Build (strict)
        run: mkdocs build --strict

      - name: Build the preview copy (browses from disk)
        run: bash scripts/docs/build_offline.sh -d site-offline

      - name: Upload the site for preview
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site-offline/
          retention-days: 14

      - name: Package the site for GitHub Pages
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Say why nothing is deployed
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::warning::Manual run on ${{ github.ref }}: Pages deploys only from main; the site was built and uploaded as an artifact only."

  deploy:
    name: deploy to GitHub Pages (manual)
    needs: build
    # Manual trigger on main only.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
