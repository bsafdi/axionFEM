# Documentation website for axionFEM (MkDocs + Material + mkdocstrings).
#
#   pip install -r docs/requirements.txt -c docs/constraints.txt
#   mkdocs serve            # live preview on http://127.0.0.1:8000
#   mkdocs build --strict   # what CI runs (.github/workflows/docs.yml)
#
# The API reference is read by griffe without importing the package, so the C++ core (_core) need not be compiled.
# The example notebooks listed in scripts/docs/gen_pages.py (SITE_NOTEBOOKS) are copied in by that script and
# rendered with their stored outputs by mkdocs-jupyter. scripts/docs/hooks.py maps links that point outside the
# site (source files, benchmarks, records) to the GitHub repository. docs/developer/docs.md describes the whole
# build, including the homepage figures.
site_name: axionFEM
site_description: >-
  Finite-element simulation for axion dark-matter detectors: lumped-element detectors, cavity haloscopes, SRF
  heterodyne cavities and SQUID readout, with mechanics and heat conduction; fluids and chemistry in beta
site_author: Joshua N. Benabou, Joshua W. Foster, Benjamin R. Safdi
site_url: https://bsafdi.github.io/axionFEM/
repo_url: https://github.com/bsafdi/axionFEM
repo_name: bsafdi/axionFEM
edit_uri: blob/main/docs/
copyright: Copyright &copy; 2026, Joshua N. Benabou, Joshua W. Foster, Benjamin R. Safdi. BSD 3-Clause license.

docs_dir: docs
site_dir: site
# Offline build (a site/ folder that browses from disk, file://):
#   AXF_DOCS_OFFLINE=true AXF_DOCS_DIRECTORY_URLS=false mkdocs build
# or scripts/docs/build_offline.sh.  The defaults are the online site.
use_directory_urls: !ENV [AXF_DOCS_DIRECTORY_URLS, true]

# Files in docs/ that are not pages of the site: figure scripts and their data, the generated captions (pages
# include them with pymdownx.snippets) and the docs build requirements.
exclude_docs: |
  /images/*.py
  /images/*.npz
  /images/home/README.md
  /images/home/captions.md
  /images/home/manifest.json
  *.tex
  /requirements.txt
  /constraints.txt

validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: info
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

hooks:
  - scripts/docs/hooks.py

# `mkdocs serve` also reloads on changes to these (read by gen_pages.py)
watch:
  - python/axionfem
  - examples
  - scripts/docs

theme:
  name: material
  logo: images/logo/axionfem_icon.svg
  favicon: images/logo/favicon.svg
  features:
    - content.code.copy
    - content.code.annotate
    - content.action.view
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
  # Viridis blue and green, the colours of the figures and the logo (docs/stylesheets/extra.css defines them).
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - offline:
      enabled: !ENV [AXF_DOCS_OFFLINE, false]
  - gen-files:
      scripts:
        - scripts/docs/gen_pages.py
  - mkdocs-jupyter:
      execute: false
      include: ["examples/*.ipynb"]
      include_source: true
      ignore_h1_titles: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [python]
          options:
            # Static analysis only: never import axionfem (the compiled
            # _core is not available when the docs are built).
            allow_inspection: false
            docstring_style: numpy
            docstring_options:
              ignore_init_summary: true
            docstring_section_style: table
            extensions:
              - scripts/docs/griffe_sphinx_roles.py:SphinxRoles
            filters: ["!^_"]
            members_order: source
            merge_init_into_class: true
            heading_level: 1
            show_root_heading: true
            show_root_full_path: true
            show_root_toc_entry: true
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_if_no_docstring: true
            show_submodules: false
            summary: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bsafdi/axionFEM

