<!doctype html>
<!--
  axionFEM viewer: HTML shell for single-file exports and the live viewer server.
  SPDX-License-Identifier: BSD-3-Clause (the inlined three.js code is MIT, see its header).

  Placeholders are written as the name wrapped in double curly braces and are
  replaced in one pass by python/axionfem/viewer.py (replacement text is never
  re-scanned):

    AXF_TITLE             page title (HTML-escaped)
    AXF_THREE_CORE        URL of three.core.min.js      \
    AXF_THREE_MODULE      URL of three.module.min.js     |  single-file export: data: URLs holding
    AXF_ORBIT_CONTROLS    URL of OrbitControls.js        |  the inlined ES module code (base64);
    AXF_ROOM_ENVIRONMENT  URL of RoomEnvironment.js      |  live server: relative URLs of the files
    AXF_VIEWER            URL of viewer.js              /
    AXF_CONFIG_JSON       JSON {"options": {...}} plus, for the live server, "sceneUrl",
                          "versionUrl", "version" (of the embedded scene) and "poll" (ms)
    AXF_SCENE_JSON        the inlined scene (JSON with '<' escaped), or null (live server
                          only: the scene is then fetched from sceneUrl when it appears)

  The import map resolves bare specifiers to those URLs, so everything works
  from file:// without network access. URL query parameters override the
  options, e.g. ?mode=section&q=Bz&scale=log (see docs/viewer.md).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="generator" content="axionFEM viewer">
<title>{{AXF_TITLE}}</title>
<style>
  :root { color-scheme: light dark; --bg: #e8ecf1; --fg: #1f2328; --err: #cf222e; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0d1117; --fg: #e6edf3; --err: #ff7b72; }
  }
  :root[data-theme="dark"] { --bg: #0d1117; --fg: #e6edf3; --err: #ff7b72; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  #axf-app { position: fixed; inset: 0; }
  #axf-boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
              padding: 24px; text-align: center; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; opacity: .75; }
  #axf-boot[hidden] { display: none; }
  #axf-boot.err { opacity: 1; color: var(--err); white-space: pre-wrap; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "{{AXF_THREE_MODULE}}",
    "axf-three-core": "{{AXF_THREE_CORE}}",
    "three/addons/controls/OrbitControls.js": "{{AXF_ORBIT_CONTROLS}}",
    "three/addons/environments/RoomEnvironment.js": "{{AXF_ROOM_ENVIRONMENT}}",
    "axionfem-viewer": "{{AXF_VIEWER}}"
  }
}
</script>
<script>
  (function () {
    var t = new URLSearchParams(location.search).get('theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    function fail(msg) {
      var b = document.getElementById('axf-boot');
      if (!b) return;
      b.hidden = false; b.className = 'err'; b.textContent = 'axionFEM viewer: ' + msg;
    }
    window.axfFail = fail;
    window.addEventListener('error', function (e) { if (!window.axfViewer) fail(e.message || String(e)); });
    setTimeout(function () {
      if (!window.axfViewer && !window.axfBooting) {
        fail('the viewer did not start. This browser may lack import-map / ES-module support, ' +
             'or a content security policy blocks inline modules.');
      }
    }, 15000);
  })();
</script>
</head>
<body>
<div id="axf-app"></div>
<div id="axf-boot">Loading the axionFEM viewer&hellip;<noscript><br>This page needs JavaScript.</noscript></div>
<script type="application/json" id="axf-config">{{AXF_CONFIG_JSON}}</script>
<script type="application/json" id="axf-scene">{{AXF_SCENE_JSON}}</script>
<script type="module">
import { createViewer, optionsFromURL } from 'axionfem-viewer';

const boot = document.getElementById('axf-boot');
const app = document.getElementById('axf-app');
const fail = (msg) => window.axfFail(msg);
window.axfBooting = true;

let cfg = {};
try {
  cfg = JSON.parse(document.getElementById('axf-config').textContent || '{}') || {};
} catch (e) {
  fail('bad configuration block: ' + e.message);
}
const options = Object.assign({}, cfg.options || {}, optionsFromURL(location.search));

async function getJSON(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
  return r.json();
}

function start(scene) {
  const viewer = createViewer(app, scene, options);
  window.axfViewer = viewer;
  boot.hidden = true;
  return viewer;
}

async function live(viewer) {
  // Live mode (axionfem.viewer.serve): poll the scene's version and swap in the
  // new scene whenever the solver rewrites scene.json. Incomplete files are
  // answered with HTTP 503 by the server and retried at the next poll.
  const poll = Math.max(250, cfg.poll || 1000);
  let version = viewer ? cfg.version : null;
  let busy = false;
  const status = (text, kind) => { if (viewer) viewer.setStatus(text, kind); else { boot.hidden = false; boot.textContent = text; } };
  async function tick() {
    if (busy) return;
    busy = true;
    try {
      const v = await getJSON(cfg.versionUrl);
      if (!v.exists) status('waiting for the scene file\u2026', 'warn');
      else if (v.version !== version) {
        status('updating\u2026', 'busy');
        const scene = await getJSON(cfg.sceneUrl);
        if (viewer) viewer.setScene(scene); else viewer = start(scene);
        version = v.version;
        viewer.setStatus('updated ' + new Date().toLocaleTimeString(), 'ok');
      }
    } catch (e) {
      status(String(e.message || e).includes('HTTP 503') ? 'waiting for a complete scene\u2026' : 'server unreachable', 'warn');
    } finally {
      busy = false;
    }
  }
  if (viewer) viewer.setStatus('live', 'ok'); else await tick();
  setInterval(tick, poll);
}

try {
  const embedded = JSON.parse(document.getElementById('axf-scene').textContent);
  const viewer = embedded ? start(embedded) : null;
  if (cfg.sceneUrl) await live(viewer);
  else if (!viewer) throw new Error('no scene is embedded in this page');
} catch (e) {
  console.error(e);
  fail(e && e.message ? e.message : String(e));
}
</script>
</body>
</html>
